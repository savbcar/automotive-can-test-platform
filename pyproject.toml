[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-can-test-platform"
version = "1.0.0"
description = "Software-only CAN/ECU communication, diagnostics, fault injection and regression test platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Savio"}]
dependencies = [
  "python-can>=4.3,<5",
  "cantools>=39,<41",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "pytest-html>=4,<5",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6,<7",
]

[project.scripts]
can-platform = "automotive_can.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "requires_cantools: requires cantools to be installed",
  "requires_socketcan: requires a Linux SocketCAN interface such as vcan0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["automotive_can"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
