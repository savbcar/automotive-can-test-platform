name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Unit, integration and regression tests
        run: pytest -q --cov=automotive_can --cov-report=term-missing --cov-report=xml
      - name: Generate regression evidence
        run: python -m automotive_can regression --output reports/ci
      - name: Upload regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: reports/ci

  socketcan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and CAN kernel modules
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            can-utils \
            "linux-modules-extra-$(uname -r)"
          python -m pip install -e '.[dev]'

      - name: Create vcan0
        run: |
          echo "Runner kernel: $(uname -r)"
          modinfo vcan
          sudo modprobe can
          sudo modprobe can_raw
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
          ip -details link show vcan0
      - name: python-can SocketCAN integration
        env:
          CAN_SOCKETCAN_TEST: "1"
        run: pytest -q tests/integration/test_socketcan_optional.py

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build --parallel
      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure
